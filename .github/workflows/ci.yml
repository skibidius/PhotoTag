name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  build-android:
    name: Build Android
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.p12
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.p12
          storeType=PKCS12
          EOF
          fi
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/phototag.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/phototag.aab
      - name: Collect the RuStore APK
        run: cp dist/phototag.apk dist/phototag-rustore.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: dist/*

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p dist
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -q dist/phototag.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          if-no-files-found: error
          path: dist/*

  release:
    name: Release
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Show files
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/phototag.apk
            dist/phototag.aab
            dist/phototag.ipa
            dist/phototag-rustore.apk

  altstore:
    name: Update AltStore source
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate source JSON
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD=$(sed -nE 's/^version:.*\+([0-9]+).*/\1/p' pubspec.yaml)
          SIZE=$(stat -c%s dist/phototag.ipa)
          DATE=$(date +%F)
          mkdir -p docs
          cp assets/icon/icon.png docs/icon.png
          cat > docs/altstore.json <<EOF
          {
            "name": "PhotoTag",
            "identifier": "com.phototag.source",
            "subtitle": "GPS camera with location watermarks",
            "description": "Field photos with coordinates, direction, altitude and time stamped straight into the image. Projects, offline geocoding and ZIP export.",
            "website": "https://skibidius.github.io/PhotoTag/",
            "tintColor": "#009586",
            "iconURL": "https://skibidius.github.io/PhotoTag/icon.png",
            "featuredApps": ["com.phototag"],
            "apps": [
              {
                "name": "PhotoTag",
                "bundleIdentifier": "com.phototag",
                "developerName": "skibidius",
                "subtitle": "GPS camera with location watermarks",
                "localizedDescription": "Point, shoot, and the photo comes back with coordinates, compass direction, altitude and time burned into the corner. Built for field reports, site surveys and inspections.",
                "iconURL": "https://skibidius.github.io/PhotoTag/icon.png",
                "tintColor": "#009586",
                "category": "utilities",
                "screenshots": [
                  "https://skibidius.github.io/PhotoTag/screenshots/en/camera.png",
                  "https://skibidius.github.io/PhotoTag/screenshots/en/watermark.png",
                  "https://skibidius.github.io/PhotoTag/screenshots/en/projects.png"
                ],
                "appPermissions": {
                  "entitlements": [],
                  "privacy": {
                    "NSCameraUsageDescription": "PhotoTag uses the camera to capture photos with location watermarks.",
                    "NSLocationWhenInUseUsageDescription": "PhotoTag uses your location to stamp coordinates, direction and altitude onto photos.",
                    "NSPhotoLibraryAddUsageDescription": "PhotoTag saves your stamped photos to your photo library.",
                    "NSPhotoLibraryUsageDescription": "PhotoTag saves your stamped photos to your photo library."
                  }
                },
                "versions": [
                  {
                    "version": "${VERSION}",
                    "buildVersion": "${BUILD}",
                    "date": "${DATE}",
                    "downloadURL": "https://github.com/skibidius/PhotoTag/releases/download/${GITHUB_REF_NAME}/phototag.ipa",
                    "size": ${SIZE},
                    "minOSVersion": "13.0"
                  }
                ]
              }
            ]
          }
          EOF
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/altstore.json docs/icon.png
          git commit -m "AltStore source for ${GITHUB_REF_NAME}" || echo "No changes"
          git push origin HEAD:main
